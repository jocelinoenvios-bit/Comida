services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boraqui
      POSTGRES_PASSWORD: boraqui_dev_password
      POSTGRES_DB: boraqui
    ports:
      - "5432:5432"
    volumes:
      - boraqui_pgdata:/var/lib/postgresql/data

volumes:
  boraqui_pgdata:
